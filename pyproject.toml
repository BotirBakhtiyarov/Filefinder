[tool.poetry]
name = "filefinder"
version = "3.0.3"
description = "FileFinder v3 — cross-platform semantic file search and RAG chat desktop app (Flet)"
authors = ["Botir Bakhtiyarov"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/BotirBakhtiyarov/Filefinder"
repository = "https://github.com/BotirBakhtiyarov/Filefinder"
packages = [{ include = "filefinder", from = "src" }]
include = [
    { path = "assets", format = ["sdist", "wheel"] },
    { path = "models/.gitkeep", format = ["sdist"] },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
flet = ">=0.24"
chromadb = "*"
onnxruntime = "*"
tokenizers = "*"
safetensors = "*"
huggingface-hub = "*"
pytesseract = "*"
Pillow = "*"
pdfplumber = "*"
pdf2image = "*"
python-docx = "*"
openpyxl = "*"
python-pptx = "*"
watchdog = "*"
pystray = "*"
pynput = "*"
cryptography = "*"
requests = "*"
numpy = "*"
sqlite-vec = { version = "*", optional = true }

[tool.poetry.group.android]
optional = true

[tool.poetry.group.android.dependencies]
sqlite-vec = "*"

[tool.poetry.group.dev.dependencies]
pytest = "*"

[tool.poetry.extras]
android = ["sqlite-vec"]

[tool.poetry.scripts]
filefinder = "filefinder.main:run"

[build-system]
requires = ["poetry-core>=1.8"]
build-backend = "poetry.core.masonry.api"

[tool.flet]
org = "com.botirbakhtiyarov"
product = "FileFinder"
company = "Botir Bakhtiyarov"

[tool.flet.app]
path = "src"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# S110: try/except/pass is the intentional graceful-degradation pattern in this
# codebase (optional deps, per-file indexing failures must never crash the UI).
# DTZ*: naive local datetimes are fine for a desktop app (single timezone user).
ignore = ["S110", "DTZ011", "DTZ005", "DTZ006"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_unused_ignores = false
disable_error_code = ["annotation-unchecked"]

[[tool.mypy.overrides]]
module = "filefinder.ui.*"
# flet 0.86's per-control Event[T] generics conflict with our base ControlEvent
# handler annotations (contravariance); the handlers are correct at runtime.
disable_error_code = ["arg-type", "assignment", "attr-defined", "union-attr", "operator", "dict-item", "call-arg", "return-value"]
